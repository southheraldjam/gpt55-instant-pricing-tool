  <circle cx="1050" cy="280" r="140" fill="none" stroke="#0fbf8f" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="1050" cy="280" r="220" fill="none" stroke="#0fbf8f" stroke-opacity="0.04" stroke-width="1"/>

  <line x1="100" y1="45" x2="1100" y2="45" stroke="url(#line)" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="80" y1="315" x2="1120" y2="315" stroke="url(#line)" stroke-opacity="0.4" stroke-width="1"/>

  <path d="M0 200 Q 300 180 600 210 T 1200 190" fill="none" stroke="#2d6cdf" stroke-opacity="0.06" stroke-width="1"/>
  <path d="M0 240 Q 400 260 800 230 T 1200 250" fill="none" stroke="#0fbf8f" stroke-opacity="0.05" stroke-width="1"/>

